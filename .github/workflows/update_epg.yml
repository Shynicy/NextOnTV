name: Aggiornamento Palinsesti TV Giornaliero (NextOnTV)

on:
  schedule:
    # 00:01 Italiana:
    # - Inverno (CET, UTC+1): 23:01 UTC
    # - Estate (CEST, UTC+2): 22:01 UTC
    - cron: '1 23 * * *'
    - cron: '1 22 * * *'
  workflow_dispatch: # Permette di avviare l'aggiornamento a mano da GitHub con un click

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui aggiornamento palinsesti TV 7 giorni
        run: |
          python update_epg.py

      - name: Commit e Push dei palinsesti aggiornati su GitHub Pages
        run: |
          git config user.name "NextOnTV Bot"
          git config user.email "bot@nextontv.local"
          git add data/ .nojekyll
          git diff --staged --quiet || (git commit -m "Aggiornamento automatico palinsesti TV 7 giorni ($(date +'%Y-%m-%d %H:%M'))" && git push)

